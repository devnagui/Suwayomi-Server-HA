name: Build and publish Suwayomi HA repackaging

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      update_upstream:
        description: Check upstream server and compatible WebUI releases, then bump the HA patch version if either changes
        type: boolean
        default: true
      release_version:
        description: Optional newer HA version for packaging-only changes; requires update_upstream=false and retains current server/WebUI pins
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: suwayomi-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.pins.outputs.build }}
      publish: ${{ steps.pins.outputs.publish }}
      changed: ${{ steps.pins.outputs.changed }}
      version: ${{ steps.pins.outputs.version }}
      source: ${{ steps.pins.outputs.source }}
      webui: ${{ steps.pins.outputs.webui }}
      webui_sha256: ${{ steps.pins.outputs.webui_sha256 }}
      webui_min_server: ${{ steps.pins.outputs.webui_min_server }}
      image_base: ${{ steps.pins.outputs.image_base }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify bounded metadata retries
        run: node --test scripts/release-reliability.test.cjs
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify selective Gradle download retries
        run: python scripts/test_gradle_retry.py
      - run: pip install -r tests/requirements-suwayomi.txt
      - name: Prepare an explicit packaging-only release without changing upstream pins
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          UPDATE_UPSTREAM: ${{ inputs.update_upstream }}
        run: |
          python - <<'PY'
          import os, subprocess, yaml
          from pathlib import Path
          if os.environ["UPDATE_UPSTREAM"] != "false":
              raise SystemExit("release_version requires update_upstream=false")
          source = yaml.safe_load(Path("suwayomi/build.yaml").read_text())["args"]["SOURCE_REF"]
          subprocess.run([
              "node", "-e",
              "require('./scripts/update-suwayomi.cjs').pin(process.argv[1],process.argv[2])",
              os.environ["RELEASE_VERSION"], source,
          ], check=True)
          PY
      - name: Check upstream without committing untested metadata
        if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.update_upstream)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-suwayomi.cjs --latest
      - name: Read prepared pins and immutable release state
        id: pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, subprocess, yaml
          from pathlib import Path
          config = yaml.safe_load(Path("suwayomi/config.yaml").read_text())
          build = yaml.safe_load(Path("suwayomi/build.yaml").read_text())
          diff = subprocess.run(["git", "diff", "--quiet", "--", "suwayomi/config.yaml", "suwayomi/build.yaml", "suwayomi/Dockerfile"])
          if diff.returncode not in (0, 1):
              raise SystemExit("Could not inspect the prepared source changes")
          changed = diff.returncode == 1
          should_build = os.environ["GITHUB_EVENT_NAME"] != "schedule" or changed
          publish = should_build and os.environ["GITHUB_EVENT_NAME"] != "pull_request" and os.environ["GITHUB_REF"] == "refs/heads/main"
          if publish:
              release = subprocess.run(
                  ["node", "scripts/github-metadata.cjs",
                   f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/v{config['version']}"],
                  check=True, stdout=subprocess.PIPE, text=True, timeout=90,
              )
              if release.stdout.strip() == "200":
                  publish = False
                  print("This HA version is already released; tests will run without overwriting its images.")
              elif release.stdout.strip() != "404":
                  raise SystemExit("Unexpected upstream release metadata status")
          values = {
              "version": config["version"], "source": build["args"]["SOURCE_REF"],
              "webui": build["args"]["WEBUI_REF"], "webui_sha256": build["args"]["WEBUI_SHA256"],
              "webui_min_server": build["args"]["WEBUI_MIN_SERVER"],
              "image_base": "ghcr.io/" + os.environ["GITHUB_REPOSITORY"].lower(),
              "build": str(should_build).lower(), "publish": str(publish).lower(),
              "changed": str(changed).lower(),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, value in values.items():
                  output.write(f"{name}={value}\n")
          PY
      - name: Preserve the exact prepared source for both architectures
        if: steps.pins.outputs.build == 'true'
        run: tar --exclude=.git -czf "$RUNNER_TEMP/repackaging-source.tar.gz" .
      - uses: actions/upload-artifact@v7
        if: steps.pins.outputs.build == 'true'
        with:
          name: prepared-source
          path: ${{ runner.temp }}/repackaging-source.tar.gz
          retention-days: 1

  build:
    needs: prepare
    timeout-minutes: 40
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: prepared-source
          path: ${{ runner.temp }}/prepared
      - run: mkdir -p build && tar -xzf "$RUNNER_TEMP/prepared/repackaging-source.tar.gz" -C build
      - name: Validate HA app manifest
        uses: frenck/action-app-linter@v2
        with:
          path: build/suwayomi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r build/tests/requirements-suwayomi.txt
      - run: python -m unittest discover -s build/tests -p test_suwayomi.py
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm --prefix build/tests ci
      - run: npx --prefix build/tests playwright install --with-deps chromium
      - name: Verify browser route-readiness regression
        run: node --test build/tests/browser_ready.test.mjs
      - uses: docker/setup-buildx-action@v4
      - name: Build pinned upstream source and HA repackaging
        uses: docker/build-push-action@v7
        with:
          context: build/suwayomi
          load: true
          tags: suwayomi-ha:test
          build-args: |
            SOURCE_REF=${{ needs.prepare.outputs.source }}
            WEBUI_REF=${{ needs.prepare.outputs.webui }}
            WEBUI_SHA256=${{ needs.prepare.outputs.webui_sha256 }}
            WEBUI_MIN_SERVER=${{ needs.prepare.outputs.webui_min_server }}
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          cache-from: type=gha,scope=suwayomi-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=suwayomi-${{ matrix.arch }}
      - name: Verify CEF JavaScript and USB library persistence across restart
        run: |
          for attempt in 1 2 3; do
            python build/tests/suwayomi_smoke.py suwayomi-ha:test --cef --usb-storage
          done
      - name: Verify ingress, browser iframe, direct authentication and API
        run: python build/tests/suwayomi_smoke.py suwayomi-ha:test --browser
      - name: Verify mounted USB storage and real library persistence
        run: python build/tests/suwayomi_smoke.py suwayomi-ha:test --usb-storage
      - name: Verify runtime WebUI downloads and preserved ingress
        run: python build/tests/suwayomi_smoke.py suwayomi-ha:test --webui-channel preview --browser --usb-storage
      - name: Verify direct HTTPS, configured certificate and renewal reload
        run: python build/tests/suwayomi_smoke.py suwayomi-ha:test --tls --usb-storage
      - name: Verify 0.1.4 Basic-auth migration to native UI_LOGIN
        run: >-
          python build/tests/suwayomi_smoke.py suwayomi-ha:test --browser --usb-storage
          --migration-from ghcr.io/devnagui/suwayomi-server-ha/suwayomi-${{ matrix.arch }}:0.1.4
      - name: Verify intentional native authentication failure is explicit and fail closed
        run: python build/tests/suwayomi_smoke.py suwayomi-ha:test --browser --usb-storage --auth-failure
      - name: Verify stable WebUI native login and ingress compatibility
        run: python build/tests/suwayomi_smoke.py suwayomi-ha:test --webui-channel stable --browser --usb-storage
      - uses: docker/login-action@v4
        if: needs.prepare.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload tested candidate without exposing a new HA version
        if: needs.prepare.outputs.publish == 'true'
        env:
          IMAGE: ${{ needs.prepare.outputs.image_base }}/suwayomi-${{ matrix.arch }}
        run: |
          docker tag suwayomi-ha:test "$IMAGE:build-$GITHUB_RUN_ID"
          docker push "$IMAGE:build-$GITHUB_RUN_ID"

  publish:
    needs: [prepare, build]
    timeout-minutes: 15
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Refuse to overwrite newer repository work
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/download-artifact@v8
        with:
          name: prepared-source
          path: ${{ runner.temp }}/prepared
      - run: tar -xzf "$RUNNER_TEMP/prepared/repackaging-source.tar.gz"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote both passing architectures before updating HA metadata
        env:
          IMAGE_BASE: ${{ needs.prepare.outputs.image_base }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for arch in amd64 aarch64; do
            docker buildx imagetools create \
              --tag "$IMAGE_BASE/suwayomi-$arch:$VERSION" \
              "$IMAGE_BASE/suwayomi-$arch:build-$GITHUB_RUN_ID"
          done
      - name: Record tested upstream update
        if: needs.prepare.outputs.changed == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE: ${{ needs.prepare.outputs.source }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add suwayomi/config.yaml suwayomi/build.yaml suwayomi/Dockerfile suwayomi/CHANGELOG.md
          git commit -m "Repackage upstream Suwayomi $SOURCE as HA app $VERSION" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:main
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE: ${{ needs.prepare.outputs.source }}
        run: |
          gh release create "v$VERSION" --target "$(git rev-parse HEAD)" \
            --title "Suwayomi Home Assistant repackaging $VERSION" \
            --notes "Unofficial Home Assistant repackaging of upstream Suwayomi-Server source $SOURCE. Both amd64 and ARM64 images passed ingress, browser/API, authentication and USB library-persistence tests before publication. Configure the existing FlareSolverr and storage root in HA; this release does not restart or reconfigure your HA host."
