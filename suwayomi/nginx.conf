user suwayomi;
worker_processes 1;
pid /run/suwayomi/nginx.pid;
error_log stderr warn;
events {
    worker_connections 256;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    client_max_body_size 128m;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map $http_authorization $bearer_authorization {
        default "";
        "~^Bearer " $http_authorization;
    }
    map $http_x_ingress_path $ingress_path {
        default "";
        "~^/api/hassio_ingress/[A-Za-z0-9_-]+$" $http_x_ingress_path;
    }
    upstream suwayomi_backend {
        server 127.0.0.1:4568;
    }
    server {
        listen 8080;
        allow 172.30.32.2;
        deny all;
        if ($ingress_path = "") {
            return 400;
        }
        location ^~ /__ha_auth/ {
            proxy_pass http://unix:/run/suwayomi/auth/ingress-auth.sock;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_buffering off;
            add_header Cache-Control "no-store" always;
        }
        location / {
            proxy_pass http://suwayomi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $bearer_authorization;
            proxy_set_header X-Ingress-Path "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Accept-Encoding "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_hide_header Cache-Control;
            proxy_redirect ~^http://(?:127\.0\.0\.1|localhost):4568(/.*)$ $ingress_path$1;
            proxy_redirect ~^(/(?!/).*)$ $ingress_path$1;
            sub_filter_once on;
            sub_filter '<base href="/">' '<base href="$ingress_path/">';
            sub_filter '</head>' '<script src="$ingress_path/__ha_auth/bootstrap.js"></script></head>';
            proxy_cookie_path / $ingress_path/;
            add_header Cache-Control "no-store" always;
        }
    }
    server {
        __DIRECT_LISTEN__
        __DIRECT_TLS__
        __DIRECT_ACCESS__
        location ^~ /__ha_auth/ {
            return 404;
        }
        location / {
            proxy_pass http://suwayomi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $bearer_authorization;
            proxy_set_header X-Ingress-Path "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_redirect default;
        }
    }
}
